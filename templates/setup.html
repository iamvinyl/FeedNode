<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FeedNode Setup</title><link rel="stylesheet" href="/static/admin.css"></head><body><main class="wrap"><div class="brand"><h1>FeedNode</h1><p>Unified Chat Feed</p></div><section class="card"><h2>Connect Wi-Fi</h2><p>Select the Wi-Fi network FeedNode should use.</p><form action="/api/wifi/connect" method="post"><label>Network<select name="ssid">{% for n in networks %}<option value="{{n.ssid}}">{{n.ssid}} · {{n.signal}}%</option>{% endfor %}</select></label><label>Password<input type="password" name="password" autocomplete="current-password"></label><button>Connect FeedNode</button></form></section><p class="muted">If your network is not listed, refresh this page to rescan.</p></main></body></html>

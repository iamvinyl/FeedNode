name: Build FeedNode Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "VERSION ($VERSION) does not match tag ($TAG)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release/stage/FeedNode
          rsync -a ./ release/stage/FeedNode/ \
            --exclude '.git' \
            --exclude 'release' \
            --exclude '*.tar.gz' \
            --exclude '*.sha256' \
            --exclude 'manifest.json'
          tar -C release/stage -czf "release/FeedNode-v${VERSION}.tar.gz" FeedNode
          SHA="$(sha256sum "release/FeedNode-v${VERSION}.tar.gz" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "FeedNode-v${VERSION}.tar.gz" > "release/FeedNode-v${VERSION}.tar.gz.sha256"
          cat > release/manifest.json <<MANIFEST
          {
            "version": "${VERSION}",
            "min_system_version": "0.1.0",
            "reboot_required": false,
            "hardware": ["pi-zero-2w"],
            "asset": "FeedNode-v${VERSION}.tar.gz",
            "sha256": "${SHA}",
            "notes": "See GitHub release notes."
          }
          MANIFEST

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "release/FeedNode-v${VERSION}.tar.gz" \
            "release/FeedNode-v${VERSION}.tar.gz.sha256" \
            "release/manifest.json" \
            --title "FeedNode v${VERSION}" \
            --generate-notes
